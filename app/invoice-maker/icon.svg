<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Invoice Maker mark">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 234) rotate(90) scale(292)">
      <stop stop-color="#737373"/>
      <stop offset="0.54" stop-color="#4B4B4B"/>
      <stop offset="1" stop-color="#2F2F2F"/>
    </radialGradient>
    <linearGradient id="invSheet" x1="156" y1="92" x2="356" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F6FB"/>
      <stop offset="1" stop-color="#D8DEE9"/>
    </linearGradient>
    <linearGradient id="invAccent" x1="296" y1="282" x2="356" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="invShadow" x="68" y="76" width="404" height="356" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#invShadow)">
    <!-- invoice sheet -->
    <rect x="156" y="92" width="200" height="296" rx="14" fill="url(#invSheet)" stroke="#0B1118" stroke-width="14"/>
    <!-- header bar -->
    <rect x="156" y="92" width="200" height="58" rx="14" fill="#0B1118"/>
    <rect x="156" y="118" width="200" height="32" fill="#0B1118"/>
    <text x="180" y="129" font-family="ui-monospace,monospace" font-size="20" font-weight="800" fill="#F4F6FB" letter-spacing="3">INVOICE</text>
    <circle cx="332" cy="121" r="8" fill="#34D399"/>
    <!-- meta lines -->
    <rect x="180" y="170" width="80" height="10" rx="3" fill="#0B1118" opacity="0.55"/>
    <rect x="180" y="188" width="120" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="180" y="202" width="60" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <!-- line items -->
    <rect x="180" y="232" width="80" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="316" y="232" width="20" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="180" y="252" width="120" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="316" y="252" width="20" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="180" y="272" width="100" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <rect x="316" y="272" width="20" height="8" rx="3" fill="#0B1118" opacity="0.30"/>
    <!-- divider -->
    <rect x="180" y="298" width="156" height="2" fill="#0B1118" opacity="0.18"/>
    <!-- total band -->
    <rect x="180" y="316" width="60" height="12" rx="3" fill="#0B1118" opacity="0.65"/>
    <rect x="296" y="316" width="40" height="14" rx="3" fill="url(#invAccent)"/>
    <!-- payment chip -->
    <rect x="180" y="346" width="156" height="22" rx="6" fill="#0B1118" opacity="0.10"/>
    <circle cx="194" cy="357" r="5" fill="#34D399"/>
    <rect x="206" y="353" width="80" height="8" rx="3" fill="#0B1118" opacity="0.45"/>
    <!-- AI sparkle -->
    <path d="M398 70 L406 90 L426 98 L406 106 L398 126 L390 106 L370 98 L390 90 Z" fill="#34D399"/>
  </g>
</svg>
